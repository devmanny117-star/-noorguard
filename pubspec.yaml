name: noor_guard
description: Noor Guard - Guard your time. Honor your prayers.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  http: ^1.2.0
  flutter_compass: ^0.8.1
  geolocator: ^14.0.2
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1
  geocoding: ^4.0.0
  provider: ^6.1.5+1
  url_launcher: ^6.3.1
  flutter_launcher_icons: ^0.14.4
  audioplayers: ^6.7.1
  flutter_timezone: ^5.1.0
  sensors_plus: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/mosques/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/icon.png"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
  macos:
    generate: true
    image_path: "assets/icon/icon.png"
